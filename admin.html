<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hariprasath R N | Admin Dashboard</title>
    
    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Custom styling extensions for Admin Table and Authentication Views -->
    <style>
        .admin-section {
            min-height: 100vh;
            padding-top: 120px;
        }

        /* Authentication overlay panel style */
        .auth-container {
            max-width: 420px;
            margin: 100px auto;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* Dashboard content style */
        .dashboard-wrapper {
            display: none;
            flex-direction: column;
            gap: 40px;
        }

        .dashboard-header-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        .dashboard-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .messages-list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        /* Message item styling card */
        .message-row-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: var(--radius-md);
            display: grid;
            grid-template-columns: 0.8fr 2.2fr 0.3fr;
            gap: 30px;
            align-items: flex-start;
            transition: var(--transition-fast);
        }

        .message-row-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(225, 6, 0, 0.03);
        }

        .msg-meta-side {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-name {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .msg-email {
            font-size: 0.85rem;
            color: var(--accent);
            word-break: break-all;
        }

        .msg-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .msg-body-side {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .msg-action-side {
            display: flex;
            justify-content: flex-end;
        }

        .btn-delete-msg {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-delete-msg:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-delete-msg i {
            width: 16px;
            height: 16px;
        }

        .empty-log-state {
            border: 1px dashed var(--border-color);
            padding: 80px;
            border-radius: var(--radius-md);
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-log-icon {
            width: 48px;
            height: 48px;
            color: var(--accent);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .message-row-card {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .msg-action-side {
                justify-content: flex-start;
            }
            .dashboard-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Scroll Progress Indicator -->
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar" id="scroll-progress" style="width: 100%;"></div>
    </div>
    
    <!-- Grid Patterns -->
    <div class="bg-grid-dots"></div>
    
    <!-- Background overlay lines -->
    <div class="grid-lines-overlay">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Red Geometric Accent Lines -->
    <div class="bg-geometric-lines">
        <div class="geo-line-v" style="left: 15vw;"></div>
        <div class="geo-line-v" style="left: 85vw;"></div>
    </div>

    <!-- -------------------------------------------------------------
       ADMIN NAVIGATION BAR
       ------------------------------------------------------------- -->
    <header class="navbar-container scrolled">
        <div class="navbar-wrapper">
            <a href="index.html" class="logo">
                <span>Hari</span><span class="logo-dot">.</span>
            </a>
            
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html" class="nav-link">Main Portfolio</a></li>
                </ul>
            </nav>
            
            <div class="nav-right">
                <button id="btn-logout" class="btn btn-outline" style="display: none;">Logout</button>
            </div>
        </div>
    </header>

    <!-- -------------------------------------------------------------
       DASHBOARD MAIN CONTAINER
       ------------------------------------------------------------- -->
    <main class="section-container admin-section">
        
        <!-- LOGIN AUTH MODULE -->
        <div id="auth-panel" class="auth-container">
            <h2 class="auth-title">Authorized Access</h2>
            <p class="auth-subtitle">Please enter your secret access key below.</p>
            
            <form id="auth-form">
                <div class="contact-form-group">
                    <input type="password" id="auth-key-input" class="contact-input" placeholder=" " required autofocus>
                    <label class="contact-label" for="auth-key-input">Access Key</label>
                </div>
                <button type="submit" class="btn btn-black btn-form-submit">Verify Access</button>
            </form>
        </div>

        <!-- DASHBOARD DATA MODULE -->
        <div id="dashboard-panel" class="dashboard-wrapper">
            
            <div class="dashboard-header-block">
                <div>
                    <span class="editorial-sub">Database console</span>
                    <h2 class="editorial-title" style="font-size: 3rem;">Messages log</h2>
                </div>
                <button id="btn-refresh" class="btn btn-outline">
                    <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i> Refresh
                </button>
            </div>

            <!-- Summary metrics -->
            <div class="dashboard-metrics">
                <div class="stat-card">
                    <div class="stat-number-wrapper">
                        <span id="metric-total">0</span>
                    </div>
                    <span class="stat-title">Total Messages</span>
                </div>
                
                <div class="stat-card">
                    <div class="stat-number-wrapper" style="color: var(--accent);">
                        <span id="metric-unread">0</span>
                    </div>
                    <span class="stat-title">New Inquiries</span>
                </div>
                
                <div class="stat-card">
                    <div class="stat-number-wrapper">
                        <span id="metric-senders">0</span>
                    </div>
                    <span class="stat-title">Unique Senders</span>
                </div>
            </div>

            <!-- Messages Log list -->
            <div id="messages-container" class="messages-list-container">
                <!-- Message row templates loaded via script -->
            </div>

        </div>

    </main>

    <!-- Toast Notification container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Dashboard Script -->
    <script src="admin.js"></script>
</body>
</html>
